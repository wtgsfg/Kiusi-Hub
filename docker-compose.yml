services:

  mysql:
    image: mysql:8.0
    container_name: kiusihub_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: kiusi_hub_db
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  kiusihub:
    build: .
    container_name: kiusihub_app
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/kiusi_hub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      SPRING_PROFILES_ACTIVE: prod

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      - mysql


volumes:
  mysql_data:
  uploads_data: