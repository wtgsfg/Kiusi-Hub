<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos - KiusiHub</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
    <h2>KiusiHub</h2>
    <nav id="nav-user"></nav>
</header>

<main class="container">

    <h1>Gestión de Pedidos</h1>

    <section class="form" id="nuevo-pedido">
        <div style="grid-column: 1/-1"><h3>Hacer Pedido</h3></div>
        <select id="cliente-select">
            <option value="">Selecciona un cliente</option>
        </select>
        <div class="form-buttons" style="grid-column: 1/-1;">
            <button onclick="iniciarPedido()" class="btn-primary">Elegir Productos en Catálogo</button>
            <button onclick="limpiarCliente()" class="btn-secondary">Limpiar</button>
            <button onclick="mostrarFormularioCliente()" class="btn-success">Añadir Cliente</button>
        </div>
        <div style="grid-column: 1/-1; color: #666; font-size: 0.95rem;">
            El vendedor se asigna automáticamente: <strong id="vendedor-label"></strong>
        </div>
    </section>

    <section class="form" id="nuevo-cliente" style="display: none; margin-top: 1rem;">
        <div style="grid-column: 1/-1"><h3>Nuevo Cliente</h3></div>
        <input id="nuevoClienteNombre" placeholder="Nombre">
        <input id="nuevoClienteCiudad" placeholder="Ciudad">
        <input id="nuevoClienteDireccion" placeholder="Dirección">
        <input id="nuevoClienteNit" placeholder="NIT">
        <input id="nuevoClienteNumero" placeholder="Número">
        <div class="form-buttons" style="grid-column: 1/-1;">
            <button onclick="crearCliente()" class="btn-primary">Guardar Cliente</button>
            <button onclick="ocultarFormularioCliente()" class="btn-secondary">Cancelar</button>
        </div>
        <div style="grid-column: 1/-1; color: #666; font-size: 0.95rem;">
            El vendedor del cliente se asigna automáticamente: <strong id="nuevoClienteVendedor"></strong>
        </div>
    </section>

    <!-- LISTA -->
    <section id="lista" class="grid"></section>

</main>

<footer>
    <p>&copy; 2026 KiusiHub. Todos los derechos reservados.</p>
    <div class="footer-links">
        <a href="home.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="index.html">Productos</a>
    </div>
</footer>

<script src="js/ui.js"></script>
<script src="js/pedidos.js"></script>

</body>
</html>
