<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - KiusiHub</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
    <h2>KiusiHub (Admin)</h2>
    <nav id="nav-user"></nav>
</header>

<main class="container">

    <h1>Gestión de Usuarios</h1>

    <!-- FORMULARIO -->
    <section class="form">
        <div style="grid-column: 1/-1"><h3 style="margin-top: 0; color: var(--primary-color);">Registrar / Editar Usuario</h3></div>
        <input id="id" type="hidden">
        <input id="username" placeholder="Nombre de usuario" type="text" autocomplete="username">
        <input id="password" type="password" placeholder="Contraseña (solo para crear o cambiar)">
        
        <select id="rol">
            <option value="">Seleccionar Rol</option>
            <option value="ADMIN">Administrador</option>
            <option value="VENDEDOR">Vendedor</option>
            <option value="CARTERA">Cartera</option>
            <option value="BODEGUERO">Bodeguero</option>
        </select>

        <div class="form-buttons">
            <button onclick="guardar()" class="btn-success">Guardar Usuario</button>
            <button onclick="limpiar()" class="btn-secondary">Limpiar Formulario</button>
        </div>
    </section>

    <!-- LISTA -->
    <section id="lista" class="grid"></section>

</main>

<footer>
    <p>&copy; 2026 KiusiHub. Todos los derechos reservados.</p>
    <div class="footer-links">
        <a href="home.html">Inicio</a>
        <a href="index.html">Productos</a>
        <a href="pedidos.html">Pedidos</a>
        <a href="facturas.html">Facturas</a>
    </div>
</footer>

<script src="js/ui.js"></script>
<script src="js/usuarios.js"></script>

</body>
</html>
