# ==============================================================
#  KiusiHub - PERFIL DE DESARROLLO (dev)
#  --------------------------------------------------------------
#  COPIA este archivo y renómbralo como .env o variables de entorno
#  en producción. NO subas este archivo a GitHub con contraseñas reales.
# ==============================================================

# Servidor
server.port=8080

# Base de Datos LOCAL (desarrollo)
spring.datasource.url=jdbc:mysql://localhost:3306/kiusi_hub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Inicialización BD (seguro: CREATE TABLE IF NOT EXISTS + ALTER condicionales)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Proyecto usa JdbcTemplate, no JPA/Hibernate: desactivamos efecto colateral
# spring.jpa.defer-datasource-initialization=true
# spring.jpa.hibernate.ddl-auto=none

# Consola H2 (solo desarrollo) - alternativa si no tienes MySQL
# Para usar H2, descomenta estas líneas y comenta las 3 de MySQL de arriba:
#spring.datasource.url=jdbc:h2:mem:kiusi_hub_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.username=sa
#spring.datasource.password=
#spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Nivel de logs en desarrollo
logging.level.root=INFO
logging.level.com.kiusi.kiusi_hub_db=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

# CORS en desarrollo (permitir todo)
kiusi.cors.allowed-origins=*

# API KEY exchangerate-api.com (dejar vacío para usar la tasa por defecto)
currency.api.key=

# Seguridad (desarrollo)
# Activa esta opción para NO requerir X-Kiusi-User en el header (cómodo para probar con Postman):
# (Asegúrate de que sea false en PRODUCCIÓN)
kiusi.security.bypass-auth=false
