spring.application.name=KiusiHub

# Servidor
server.port=${SERVER_PORT:8080}

# Base de Datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kiusi_hub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Inicialización BD (seguro: schema.sql usa CREATE TABLE IF NOT EXISTS + ALTER condicionales)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# No usamos JPA/Hibernate (el proyecto usa spring-boot-starter-jdbc / JdbcTemplate).
# Comentamos estas propiedades para evitar efectos colaterales en el sql.init ordering.
# spring.jpa.defer-datasource-initialization=true
# spring.jpa.hibernate.ddl-auto=none

# H2 Console (solo desarrollo, activar con perfil dev)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# CORS
kiusi.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# API Conversión de Moneda (exchangerate-api.com)
# Pedir API KEY gratuita en https://app.exchangerate-api.com/sign-up
currency.api.key=${CURRENCY_API_KEY:}

# Logging
logging.level.root=INFO
logging.level.com.kiusi.kiusihub=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

# Perfil activo por defecto
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
